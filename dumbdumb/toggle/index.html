<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dumbdumb</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f2; --text: #1d2321; --muted: #5c6662; --accent: #26655a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121614; --text: #eef2f0; --muted: #a3ada9; --accent: #7cc7b6; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 0 16px; }
  main { max-width: 420px; text-align: center; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 12px; }
  strong { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>This is a Dumbdumb tag</h1>
  <p>Tap it with Dumbdumb installed and your iPhone offers <strong>Open in Dumbdumb</strong>, which turns Dumb Mode on or off.</p>
  <p>Dumbdumb keeps only the apps you choose and quiets everything else.</p>
</main>
</body>
</html>
